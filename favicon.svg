<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="fav-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Capa 1: Hexágono robusto contenedor -->
  <path d="M50 10 L85 30 L85 70 L50 90 L15 70 L15 30 Z" stroke="url(#fav-grad)" stroke-width="8" stroke-linejoin="round" />
  <!-- Capa 2: Órbitas concentradas -->
  <circle cx="50" cy="50" r="22" stroke="rgba(6, 182, 212, 0.4)" stroke-width="4" />
  <!-- Capa 3: Nodo núcleo cibernético brillante -->
  <circle cx="50" cy="50" r="12" fill="url(#fav-grad)" filter="url(#fav-glow)" />
  <!-- Capa 4: Conexiones de circuito -->
  <path d="M50 10 L50 22 M50 78 L50 90 M15 30 L30 38 M85 70 L70 62 M15 70 L30 62 M85 30 L70 38" stroke="url(#fav-grad)" stroke-width="5" stroke-linecap="round" />
</svg>
